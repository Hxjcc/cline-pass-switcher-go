name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: go vet ./...
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint && npm test && npm run build
        working-directory: web
      - name: Verify embedded frontend matches source
        run: |
          git diff --exit-code -- internal/webassets/dist
          test -z "$(git ls-files --others --exclude-standard -- internal/webassets/dist)"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # Boots the real binary (temporary data directory, admin key from the
      # config) and drives the console in Chromium: sign-in, issuing a client
      # key, the boot-frame masking and the effective-settings table.
      - run: npm run test:e2e
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cline-pass-ci .
      - name: Verify the runtime user and a writable data directory
        run: |
          mkdir -p ci-data
          docker run --rm -v "$PWD/ci-data:/data" cline-pass-ci sh -c 'test "$(id -u)" = 10001 && test -w /data'
