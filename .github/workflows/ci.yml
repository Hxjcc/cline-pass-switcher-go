name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - name: Windows tests
        if: runner.os == 'Windows'
        run: go test ./...
      - name: Linux tests, race and coverage
        if: runner.os == 'Linux'
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Static analysis
        if: runner.os == 'Linux'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Go vulnerability check
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Coverage (minimum 75 percent)
        if: runner.os == 'Linux'
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          awk '/^total:/ { found=1; if ($3+0 < 75) exit 1 } END { if (!found) exit 1 }' coverage.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - run: npm run lint && npm test && npm run build
        working-directory: web
      - name: Verify embedded frontend matches source
        # Dependabot PRs are repaired after merge by sync-dist.yml. Human PRs
        # still have to keep the checked-in artifact in sync before merge.
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          git diff --exit-code -- internal/webassets/dist
          test -z "$(git ls-files --others --exclude-standard -- internal/webassets/dist)"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # Exercise the frontend built from this revision, including dependency
      # PRs whose checked-in dist still belongs to the base branch.
      - run: npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # Boots the real binary (temporary data directory, admin key from the
      # config) and drives the console in Chromium: sign-in, issuing a client
      # key, the boot-frame masking and the effective-settings table.
      - run: npm run test:e2e
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --pull -t cline-pass-ci .
      - name: Verify the runtime user and a writable data directory
        run: |
          mkdir -p ci-data
          docker run --rm -v "$PWD/ci-data:/data" cline-pass-ci sh -c 'test "$(id -u)" = 10001 && test -w /data'
