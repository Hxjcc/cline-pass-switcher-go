name: Sync embedded frontend

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Commit rebuilt assets
        run: |
          if [ -z "$(git status --porcelain -- internal/webassets/dist)" ]; then
            echo "embedded frontend already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- internal/webassets/dist
          git commit -m "Sync embedded frontend assets"
          git push
